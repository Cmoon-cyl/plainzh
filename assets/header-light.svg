<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">PlainZH · 中文清晰写作</title>
<desc id="desc">把话写清楚。将“对方案进行讨论”改为“讨论方案”。</desc>
<rect x="1" y="1" width="1198" height="298" rx="22" fill="#F5F7FE" stroke="#E5EAF7" stroke-width="2"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="55" y="127" fill="#202A46" font-size="88" font-weight="720" letter-spacing="-4">PlainZH</text>
<text x="59" y="182" fill="#202A46" font-size="27" font-weight="500">中文清晰写作</text>
<text x="59" y="230" fill="#64718E" font-size="21">把话写清楚。</text>
<path d="M552 58V242" stroke="#DCE3F4" stroke-width="2"/>
<text x="624" y="70" fill="#64718E" font-size="17">改写前</text>
<text x="624" y="120" fill="#64718E" font-size="34">对方案进行讨论</text>
<path d="M620 108H868" stroke="#B4C1E0" stroke-width="3" stroke-linecap="round"/>
<text x="624" y="183" fill="#64718E" font-size="17">改写后</text>
<text x="624" y="239" fill="#315EFB" font-size="48" font-weight="600">讨论方案。</text>
<path d="M868 199V243" stroke="#315EFB" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
